apiVersion: batch/v1
kind: CronJob
metadata:
  name: data-ingestion-job
  namespace: ai-career-os
  labels:
    app.kubernetes.io/name: ingestion-cronjob
    app.kubernetes.io/component: cronjob
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: ingestion-job
        spec:
          restartPolicy: OnFailure
          containers:
            - name: ingestion
              image: ai-career-os-backend:latest
              imagePullPolicy: IfNotPresent
              command: ["node", "dist/scripts/seed.js"]
              envFrom:
                - configMapRef:
                    name: backend-config
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
